name: Static source and privacy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect source without importing analysis modules
        run: python tools/check_repository.py
      - name: Install test-only matrix dependencies
        run: python -m pip install numpy pandas
      - name: Synthetic input and workflow safety tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: find scripts -type f \( -name '*.sh' -o -name '*.sbatch' \) -print0 | xargs -0 -n1 bash -n
