name: Code and privacy audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pandas numpy pyyaml
      - name: Audit public contents
        run: python scripts/audit_public_repository.py
      - name: Parse Python source
        run: python -c 'import ast,pathlib; files=list(pathlib.Path(".").rglob("*.py")); [ast.parse(path.read_text(), filename=str(path)) for path in files]; print(f"Parsed {len(files)} Python files")'
      - name: Check Python command interfaces
        run: python -c 'import pathlib,subprocess; files=list(pathlib.Path("pipelines").rglob("*.py"))+list(pathlib.Path("scripts").rglob("*.py")); [subprocess.run(["python",str(path),"--help"],check=True,stdout=subprocess.DEVNULL) for path in files]; print(f"Checked {len(files)} command interfaces")'
      - name: Check shell syntax
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run patient-data-free regression tests
        run: python -m unittest discover -s tests -v
