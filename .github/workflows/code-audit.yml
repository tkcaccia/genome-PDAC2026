name: Static source and privacy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect source without importing analysis modules
        run: python tools/check_repository.py
      - name: Check shell syntax
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
